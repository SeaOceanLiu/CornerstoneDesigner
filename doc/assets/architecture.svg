<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="880" height="270" rx="8" fill="#1A1A1A"/>

  <!-- 外框 -->
  <rect x="20" y="20" width="840" height="230" rx="8" fill="#202020" stroke="#505050" stroke-width="1"/>
  <text x="40" y="50" font-size="15" font-weight="bold" fill="#E0E0E0">CornerstoneDesigner</text>

  <!-- 左块：UICornerstone 控件树（Binding） -->
  <rect x="40" y="66" width="410" height="168" rx="6" fill="#282828" stroke="#404040" stroke-width="1"/>
  <text x="56" y="90" font-size="13" font-weight="bold" fill="#6FA8DC">UICornerstone 控件树（Binding）</text>

  <rect x="56" y="102" width="178" height="38" rx="4" fill="#202020" stroke="#505050" stroke-width="1"/>
  <text x="145" y="125" font-size="12" fill="#E0E0E0" text-anchor="middle">Toolbox (Panel)</text>
  <rect x="256" y="102" width="178" height="38" rx="4" fill="#202020" stroke="#505050" stroke-width="1"/>
  <text x="345" y="125" font-size="12" fill="#E0E0E0" text-anchor="middle">Canvas (Panel)</text>
  <rect x="56" y="148" width="178" height="38" rx="4" fill="#202020" stroke="#505050" stroke-width="1"/>
  <text x="145" y="171" font-size="12" fill="#E0E0E0" text-anchor="middle">PropertyPanel</text>
  <rect x="256" y="148" width="178" height="38" rx="4" fill="#202020" stroke="#505050" stroke-width="1"/>
  <text x="345" y="171" font-size="12" fill="#E0E0E0" text-anchor="middle">(Panel/Scroll)</text>
  <rect x="56" y="194" width="178" height="26" rx="4" fill="#202020" stroke="#505050" stroke-width="1"/>
  <text x="145" y="211" font-size="12" fill="#E0E0E0" text-anchor="middle">TreeView</text>
  <rect x="256" y="194" width="178" height="26" rx="4" fill="#202020" stroke="#505050" stroke-width="1"/>
  <text x="345" y="211" font-size="12" fill="#E0E0E0" text-anchor="middle">MenuBar / StatusBar</text>

  <!-- 右块：Core 引擎层 -->
  <rect x="470" y="66" width="370" height="168" rx="6" fill="#282828" stroke="#404040" stroke-width="1"/>
  <text x="486" y="90" font-size="13" font-weight="bold" fill="#6FA8DC">Core 引擎层（C++17）</text>
  <text x="486" y="120" font-size="12" fill="#E0E0E0">LayoutEngine</text>
  <text x="608" y="120" font-size="12" fill="#E0E0E0">ProjectManager</text>
  <text x="486" y="148" font-size="12" fill="#E0E0E0">Serializer</text>
  <text x="608" y="148" font-size="12" fill="#E0E0E0">CodeGen</text>
  <text x="486" y="176" font-size="12" fill="#E0E0E0">UndoRedoService</text>
  <text x="608" y="176" font-size="12" fill="#E0E0E0">EventManager</text>
  <text x="486" y="204" font-size="12" fill="#E0E0E0">ControlModel</text>

  <!-- 关联箭头 -->
  <path d="M450 150 L466 150" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#4A90D9"/>
    </marker>
  </defs>
</svg>