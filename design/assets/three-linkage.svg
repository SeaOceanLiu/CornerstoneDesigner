<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="210" viewBox="0 0 1160 210" font-family="HarmonyOS Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#4A90D9"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="210" rx="8" fill="#1A1A1A"/>

  <g font-size="20" fill="#E0E0E0" text-anchor="middle">
    <rect x="20" y="40" width="150" height="56" rx="6" fill="#282828" stroke="#404040" stroke-width="1"/>
    <text x="95" y="63">控件树</text>
    <text x="95" y="81">选中节点</text>

    <path d="M174 68 L196 68" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="200" y="40" width="150" height="56" rx="6" fill="#282828" stroke="#404040" stroke-width="1"/>
    <text x="275" y="63">画布同步高亮</text>
    <text x="275" y="81">+ 挂载控点</text>

    <path d="M354 68 L376 68" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="380" y="40" width="150" height="56" rx="6" fill="#282828" stroke="#404040" stroke-width="1"/>
    <text x="455" y="63">属性/事件面板</text>
    <text x="455" y="81">加载</text>

    <path d="M534 68 L556 68" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="560" y="40" width="150" height="56" rx="6" fill="#282828" stroke="#404040" stroke-width="1"/>
    <text x="635" y="63">编辑属性</text>
    <text x="635" y="81">/ 绑定事件</text>

    <path d="M714 68 L736 68" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="740" y="40" width="150" height="56" rx="6" fill="#282828" stroke="#404040" stroke-width="1"/>
    <text x="815" y="63">画布增量更新</text>
    <text x="815" y="81">/ Undo 入栈</text>

    <path d="M894 68 L916 68" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="920" y="40" width="150" height="56" rx="6" fill="#282828" stroke="#404040" stroke-width="1"/>
    <text x="995" y="63">预览</text>
    <text x="995" y="81">300ms 防抖刷新</text>

    <path d="M1074 68 L1096 68" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="1100" y="40" width="40" height="56" rx="6" fill="#282828" stroke="#404040" stroke-width="1"/>
    <text x="1120" y="58" font-size="20">导出</text>
    <text x="1120" y="72" font-size="20">LayoutParser JSON</text>
  </g>

  <!-- 回环：导出 JSON 回到 控件树选中 -->
  <path d="M1120 96 L1120 156 L95 156 L95 100" fill="none" stroke="#FF8800" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="610" y="170" font-size="20" fill="#808080" text-anchor="middle">导出结果可再次 LoadLayout 加载（设计-预览-导出闭环）</text>
</svg>