<svg xmlns="http://www.w3.org/2000/svg" width="860" height="720" viewBox="0 0 860 720" font-family="HarmonyOS Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
  <!-- 底板 -->
  <rect x="0" y="0" width="860" height="720" rx="8" fill="#1A1A1A"/>
  <text x="24" y="30" font-size="20" font-weight="bold" fill="#E0E0E0">左栏 · 工具箱（F1）— 分组 + 搜索 + 组件动态分组</text>

  <!-- Tab 条 -->
  <rect x="20" y="46" width="400" height="32" rx="4" fill="#282828" stroke="#505050" stroke-width="1"/>
  <rect x="28" y="52" width="96" height="20" rx="3" fill="#2A3F5C"/>
  <text x="40" y="66" font-size="20" fill="#6FA8DC">工具箱</text>
  <text x="150" y="66" font-size="20" fill="#A0A0A0">控件树</text>
  <text x="234" y="66" font-size="20" fill="#A0A0A0">资源</text>
  <rect x="28" y="72" width="96" height="2" fill="#4A90D9"/>

  <!-- 搜索框 -->
  <rect x="32" y="86" width="376" height="22" rx="4" fill="#202020" stroke="#505050" stroke-width="1"/>
  <text x="40" y="100" font-size="20" fill="#808080">搜索控件…（F1.3，P2）</text>
  <circle cx="396" cy="97" r="4" fill="none" stroke="#505050" stroke-width="1.2"/>
  <line x1="399" y1="100" x2="403" y2="104" stroke="#505050" stroke-width="1.2"/>

  <!-- 分组容器 -->
  <rect x="20" y="118" width="400" height="560" rx="4" fill="#282828" stroke="#404040" stroke-width="1"/>

  <!-- 基础控件组 -->
  <text x="32" y="140" font-size="20" fill="#808080">基础控件</text>
  <!-- Label -->
  <text x="76" y="166" font-size="20" fill="#E0E0E0">Label</text>
  <rect x="42" y="153" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <text x="46.5" y="166" font-size="20" font-weight="bold" fill="#A0A0A0">A</text>
  <!-- Button（选中态） -->
  <rect x="28" y="178" width="384" height="26" rx="4" fill="#2A3F5C"/>
  <rect x="28" y="178" width="3" height="26" rx="1.5" fill="#4A90D9"/>
  <text x="76" y="196" font-size="20" fill="#6FA8DC">Button</text>
  <rect x="42" y="183" width="16" height="16" rx="3" fill="#202020" stroke="#4A90D9" stroke-width="1"/>
  <rect x="45" y="188" width="10" height="6" rx="1.5" fill="#4A90D9"/>
  <!-- CheckBox -->
  <text x="76" y="222" font-size="20" fill="#E0E0E0">CheckBox</text>
  <rect x="42" y="209" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <rect x="45" y="212" width="10" height="10" rx="2" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <path d="M47.5 216.5 l2 2 l4 -4.5" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <!-- EditBox -->
  <text x="76" y="248" font-size="20" fill="#E0E0E0">EditBox</text>
  <rect x="42" y="235" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <rect x="44" y="239" width="12" height="7" rx="1" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <line x1="50" y1="239.5" x2="50" y2="245.5" stroke="#A0A0A0" stroke-width="1"/>
  <!-- TextArea -->
  <text x="76" y="274" font-size="20" fill="#E0E0E0">TextArea</text>
  <rect x="42" y="261" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <rect x="44" y="265" width="12" height="8" rx="1" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <line x1="46" y1="268" x2="54" y2="268" stroke="#A0A0A0" stroke-width="1"/>
  <line x1="46" y1="271" x2="54" y2="271" stroke="#A0A0A0" stroke-width="1"/>
  <!-- ProgressBar -->
  <text x="76" y="300" font-size="20" fill="#E0E0E0">ProgressBar</text>
  <rect x="42" y="287" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <rect x="44" y="290" width="12" height="5" rx="1" fill="#A0A0A0"/>
  <rect x="44" y="290" width="7" height="5" rx="1" fill="#4A90D9"/>
  <!-- Slider -->
  <text x="76" y="326" font-size="20" fill="#E0E0E0">Slider</text>
  <rect x="42" y="313" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <line x1="44" y1="321" x2="56" y2="321" stroke="#A0A0A0" stroke-width="1"/>
  <circle cx="51" cy="321" r="3" fill="#4A90D9"/>
  <!-- ScrollBar -->
  <text x="76" y="352" font-size="20" fill="#E0E0E0">ScrollBar</text>
  <rect x="42" y="339" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <rect x="44" y="341" width="12" height="12" rx="2" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <rect x="45" y="343" width="10" height="5" rx="1" fill="#4A90D9"/>
  <!-- Image -->
  <text x="76" y="378" font-size="20" fill="#E0E0E0">Image</text>
  <rect x="42" y="365" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <rect x="44" y="369" width="12" height="8" rx="1" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <path d="M45 374.5 l3 -3.5 l3 3 l3 -3 l1 2.5" fill="none" stroke="#A0A0A0" stroke-width="1"/>

  <!-- 容器控件组 -->
  <text x="32" y="402" font-size="20" fill="#808080">容器控件</text>
  <!-- Panel -->
  <text x="76" y="428" font-size="20" fill="#E0E0E0">Panel</text>
  <rect x="42" y="415" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <rect x="45" y="418" width="10" height="10" rx="1.5" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <!-- WinFrame -->
  <text x="76" y="454" font-size="20" fill="#E0E0E0">WinFrame</text>
  <rect x="42" y="441" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <rect x="44" y="444" width="12" height="9" rx="1" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <rect x="44" y="444" width="12" height="3" fill="#A0A0A0"/>
  <!-- Splitter -->
  <text x="76" y="480" font-size="20" fill="#E0E0E0">Splitter</text>
  <rect x="42" y="467" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <line x1="46" y1="469" x2="46" y2="481" stroke="#A0A0A0" stroke-width="1"/>
  <line x1="54" y1="469" x2="54" y2="481" stroke="#A0A0A0" stroke-width="1"/>
  <rect x="49.5" y="472" width="3" height="3" fill="#A0A0A0"/>

  <!-- 高级控件组 -->
  <text x="32" y="504" font-size="20" fill="#808080">高级控件</text>
  <!-- Menu -->
  <text x="76" y="530" font-size="20" fill="#E0E0E0">Menu</text>
  <rect x="42" y="517" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <line x1="44" y1="520" x2="56" y2="520" stroke="#A0A0A0" stroke-width="1"/>
  <line x1="44" y1="524" x2="56" y2="524" stroke="#A0A0A0" stroke-width="1"/>
  <line x1="44" y1="528" x2="56" y2="528" stroke="#A0A0A0" stroke-width="1"/>
  <!-- ComboBox -->
  <text x="76" y="556" font-size="20" fill="#E0E0E0">ComboBox</text>
  <rect x="42" y="543" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <rect x="44" y="546" width="12" height="8" rx="1" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <path d="M50 550 l2.5 2.5 l2.5 -2.5" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <!-- TreeView -->
  <text x="76" y="582" font-size="20" fill="#E0E0E0">TreeView</text>
  <rect x="42" y="569" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <path d="M45 572.5 l3.5 3 l-3.5 3 z" fill="#A0A0A0"/>
  <line x1="51" y1="573" x2="57" y2="573" stroke="#A0A0A0" stroke-width="1"/>
  <line x1="51" y1="576.5" x2="57" y2="576.5" stroke="#A0A0A0" stroke-width="1"/>
  <line x1="51" y1="580" x2="57" y2="580" stroke="#A0A0A0" stroke-width="1"/>
  <!-- ColorPicker -->
  <text x="76" y="608" font-size="20" fill="#E0E0E0">ColorPicker</text>
  <rect x="42" y="595" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <circle cx="50" cy="603" r="5" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <path d="M50 598 a5 5 0 0 1 5 5" fill="none" stroke="#E06060" stroke-width="1.3"/>
  <path d="M55 603 a5 5 0 0 1 -5 5" fill="none" stroke="#E0C060" stroke-width="1.3"/>
  <path d="M50 608 a5 5 0 0 1 -5 -5" fill="none" stroke="#60A0E0" stroke-width="1.3"/>
  <!-- NumericUpDown -->
  <text x="76" y="634" font-size="20" fill="#E0E0E0">NumericUpDown</text>
  <rect x="42" y="621" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <rect x="44" y="623.5" width="12" height="9" rx="1" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <path d="M50 626 l2 2 h-4 z" fill="#A0A0A0"/>
  <path d="M52 630.5 l-2 2 h-4 l2 -2 z" fill="#A0A0A0"/>
  <!-- Dialog -->
  <text x="76" y="660" font-size="20" fill="#E0E0E0">Dialog</text>
  <rect x="42" y="647" width="16" height="16" rx="3" fill="#202020" stroke="#505050" stroke-width="1"/>
  <rect x="44" y="650" width="12" height="9" rx="1" fill="none" stroke="#A0A0A0" stroke-width="1"/>
  <rect x="46" y="652" width="7" height="4" rx="0.5" fill="#4A90D9" opacity="0.5"/>

  <!-- 右侧交互说明 -->
  <rect x="440" y="46" width="400" height="160" rx="4" fill="#282828" stroke="#404040" stroke-width="1"/>
  <text x="456" y="70" font-size="20" font-weight="bold" fill="#E0E0E0">交互：</text>
  <text x="456" y="94" font-size="20" fill="#E0E0E0">· 点击选中 → 画布拖拽放置</text>
  <text x="456" y="118" font-size="20" fill="#E0E0E0">· 双击 → 放入画布中心</text>
  <text x="456" y="142" font-size="20" fill="#E0E0E0">· 悬停 → 提示默认尺寸</text>
  <text x="456" y="166" font-size="20" fill="#E0E0E0">· 搜索框按名称过滤（P2）</text>
  <text x="456" y="194" font-size="20" fill="#808080">每项 = 小图标 + 名称，由类型注册表驱动</text>
  <text x="456" y="216" font-size="20" fill="#808080">（与属性表单 / 导出共用同一数据源）</text>

  <!-- Animation 与组件说明 -->
  <rect x="440" y="220" width="400" height="200" rx="4" fill="#282828" stroke="#404040" stroke-width="1"/>
  <text x="456" y="244" font-size="20" font-weight="bold" fill="#E0E0E0">Animation（LuotiAni）：</text>
  <text x="456" y="268" font-size="20" fill="#E0E0E0">· 放置 + rect 编辑 + 资源路径编辑</text>
  <text x="456" y="292" font-size="20" fill="#E0E0E0">· `luotiAni` 字段输入 .jsonc 路径</text>
  <text x="456" y="316" font-size="20" fill="#E0E0E0">· 内容级编辑不做（需求 §7 边界）</text>
  <text x="456" y="348" font-size="20" font-weight="bold" fill="#E0E0E0">组件（动态）分组（P2）：</text>
  <text x="456" y="372" font-size="20" fill="#E0E0E0">· 已定义组件自动注册为可放置类型</text>
  <text x="456" y="396" font-size="20" fill="#E0E0E0">· 拖入画布 = 创建引用（type=组件名）</text>

  <!-- 图注 -->
  <text x="24" y="700" font-size="20" fill="#606060">高级控件组包含 Animation（图中略，见主界面概念图）；分组/图标最终形态见 §12 待细化项。</text>
  <rect x="12" y="672" width="836" height="24" rx="3" fill="#242424"/>
  <text x="24" y="689" font-size="20" fill="#A0A0A0">规格（01 §9.4）：Tab 条 0,0 240×32 | 搜索框 12,40 216×22 | 分组标题 11px #808080 | 列表项行高 26 图标 16×16 文字 12px</text>
</svg>